name: DevSecOps Vulnerable Lab Pipeline

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  deploy-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install and Start Juice Shop (Docker ile)
        run: |
          docker run -d -p 3000:3000 --name bami-juice-shop bkimminich/juice-shop
          
      - name: Install Ngrok
        run: |
          # Resmi ngrok repo anahtarını indiriyoruz ve ekliyoruz
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
          
          # Doğru dizine (.d/ uzantılı) repo kaynağını yazıyoruz
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          
          # Listeleri güncelleyip kurulumu tamamlıyoruz
          sudo apt-get update && sudo apt-get install ngrok

      - name: Configure Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start Ngrok Tunnel
        run: |
          # Ngrok'u arka planda başlatıyoruz ki pipeline bloklanmasın
          ngrok http 3000 --log=stdout > ngrok.log &
          sleep 5 # Tünelin oturması için kısa bir bekleme

      - name: Get Public URL
        run: |
          # Ngrok API'sinden oluşturulan dinamik public URL'i çekiyoruz
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "============================================="
          echo "LAB WEB SITESI LIVE OLMUSTUR!"
          echo "Target URL: $PUBLIC_URL"
          echo "============================================="
          # Sonraki adımlarda kullanabilmek için URL'i logluyoruz veya çevre değişkenine atıyoruz
