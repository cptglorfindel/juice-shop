name: DevSecOps Vulnerable Lab Pipeline

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Manuel tetiklemek için şart

jobs:
  deploy-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install and Start Juice Shop (Docker ile)
        run: |
          docker run -d -p 3000:3000 --name bami-juice-shop bkimminich/juice-shop
          
      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok

      - name: Configure Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Start Ngrok Tunnel
        run: |
          ngrok http 3000 --log=stdout > ngrok.log &
          sleep 10 # Tünelin tamamen oturması için bekliyoruz

      - name: Get Public URL and Wait
        run: |
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "========================================================"
          echo "LAB WEB SITESI LIVE OLMUSTUR!"
          echo "Target URL: $PUBLIC_URL"
          echo "========================================================"
          echo "Invicti Platformuna gidip yukarıdaki URL için tarama başlatın."
          echo "Internal Agent'ınızı seçmeyi unutmayın!"
          echo "Tünel 30 dakika boyunca açık kalacaktır..."
          echo "========================================================"
          
          # Pipeline'ın kapanmaması için 30 dakika (1800 saniye) boyunca döngüde bekletiyoruz
          sleep 1800
